<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic tac toe</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="game-shell">
        <header class="game-header">
            <p class="eyebrow">THE CLASSIC, REIMAGINED</p>
            <h1>Tic-tac-toe</h1>
            <p id="gameStatus" class="game-status" aria-live="polite">Choose how you want to play.</p>
        </header>

        <section class="mode-picker" aria-label="Choose a game mode">
            <button class="mode-button" id="twoPlayerBtn" type="button" data-mode="two-player" aria-pressed="false">
                <span class="mode-icon" aria-hidden="true">2</span>
                <span>Two players</span>
            </button>
            <button class="mode-button" id="singlePlayerBtn" type="button" data-mode="computer" aria-pressed="false">
                <span class="mode-icon" aria-hidden="true">AI</span>
                <span>Play with computer</span>
            </button>
        </section>

        <section id="gameArea" class="game-area" aria-label="Game board" hidden>
            <div class="tictac" role="grid" aria-label="Tic-tac-toe board">
                <button class="box" type="button" role="gridcell" aria-label="Cell 1" disabled></button>
                <button class="box" type="button" role="gridcell" aria-label="Cell 2" disabled></button>
                <button class="box" type="button" role="gridcell" aria-label="Cell 3" disabled></button>
                <button class="box" type="button" role="gridcell" aria-label="Cell 4" disabled></button>
                <button class="box" type="button" role="gridcell" aria-label="Cell 5" disabled></button>
                <button class="box" type="button" role="gridcell" aria-label="Cell 6" disabled></button>
                <button class="box" type="button" role="gridcell" aria-label="Cell 7" disabled></button>
                <button class="box" type="button" role="gridcell" aria-label="Cell 8" disabled></button>
                <button class="box" type="button" role="gridcell" aria-label="Cell 9" disabled></button>
            </div>
            <button id="resButton" class="restart-button" type="button" hidden>Restart game</button>
        </section>
    </main>

    <dialog id="resultDialog" class="result-dialog" aria-labelledby="resultTitle">
        <p class="eyebrow">GAME OVER</p>
        <h2 id="resultTitle"></h2>
        <p id="resultMessage" class="result-message"></p>
        <div class="result-actions">
            <button id="playAgainButton" class="action-button primary-action" type="button">Play again</button>
            <button id="quitButton" class="action-button secondary-action" type="button">Quit</button>
        </div>
    </dialog>

    <script src="app.js"></script>
</body>
</html>
